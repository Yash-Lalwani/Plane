components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: Set automatically by `POST /auth/login`. Used by browsers.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The `accessToken` returned by `POST /auth/login` or `POST /auth/refresh-token`.

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 16fd2706-8baf-433b-82eb-8c7fada847da
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 9b2c1f4e-3a7d-4e8b-b6c5-1d2e3f4a5b6c
    Token:
      name: token
      in: path
      required: true
      description: The raw token from the email link
      schema:
        type: string
      example: 5f4dcc3b5aa765d61d8327deb882cf99e3b0c44298fc1c149afbf4c8996fb924
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    NoContent:
      description: Success with no data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NullDataResponse"
    BadRequest:
      description: The request cannot be applied (for example an invalid or expired token)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 400
            message: Verification link is invalid or has expired
            errors: []
            success: false
    LastAdmin:
      description: The change would leave the project without an Admin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 400
            message: A project must have at least one Admin
            errors: []
            success: false
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 401
            message: Unauthorized request
            errors: []
            success: false
    Forbidden:
      description: Email not verified, or the user's role does not allow this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 403
            message: You do not have permission to perform this action
            errors: []
            success: false
    NotFound:
      description: Not found. Also returned for projects the user is not a member of.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 404
            message: Project not found
            errors: []
            success: false
    Conflict:
      description: Conflicts with existing data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 409
            message: Email is already registered
            errors: []
            success: false
    PayloadTooLarge:
      description: A file is larger than allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 413
            message: File is too large
            errors: []
            success: false
    ValidationError:
      description: The body, params or query failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 422
            message: Validation failed
            errors:
              - field: email
                message: Invalid email address
            success: false
    TooManyRequests:
      description: Rate limit reached (10 requests per 15 minutes per IP)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            statusCode: 429
            message: Too many requests, please try again later
            errors: []
            success: false

  schemas:
    ApiResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 200
        data:
          description: The response payload
        message:
          type: string
        success:
          type: boolean
          example: true
    NullDataResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 200
        data:
          type: object
          nullable: true
          example: null
        message:
          type: string
          example: Deleted successfully
        success:
          type: boolean
          example: true
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        success:
          type: boolean
          example: false
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 57
        totalPages:
          type: integer
          example: 3

    ProjectRole:
      type: string
      enum: [ADMIN, PROJECT_ADMIN, MEMBER]
      example: MEMBER
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]
      example: TODO
    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
      example: MEDIUM
    InvitationStatus:
      type: string
      enum: [PENDING, ACCEPTED, REVOKED]
      example: PENDING

    Health:
      type: object
      properties:
        api:
          type: string
          example: up
        database:
          type: string
          enum: [up, down]
          example: up
        redis:
          type: string
          enum: [up, down]
          example: up

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 9b2c1f4e-3a7d-4e8b-b6c5-1d2e3f4a5b6c
        email:
          type: string
          format: email
          example: demo@plane.dev
        username:
          type: string
          example: demo
        fullName:
          type: string
          nullable: true
          example: Demo User
        avatarUrl:
          type: string
          nullable: true
          example: https://res.cloudinary.com/demo/image/upload/plane/avatars/abc123.png
        isEmailVerified:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-09-01T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-09-01T10:00:00.000Z"
    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI5YjJjMWY0ZSJ9.signature
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI5YjJjMWY0ZSIsImp0aSI6IjEifQ.signature
    LoginResult:
      allOf:
        - type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
        - $ref: "#/components/schemas/AuthTokens"

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        name:
          type: string
          example: Website Relaunch
        description:
          type: string
          nullable: true
          example: New marketing site for the Q4 launch
        createdById:
          type: string
          format: uuid
          example: 9b2c1f4e-3a7d-4e8b-b6c5-1d2e3f4a5b6c
        createdAt:
          type: string
          format: date-time
          example: "2026-09-01T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-09-01T10:00:00.000Z"
        createdBy:
          $ref: "#/components/schemas/User"
        role:
          $ref: "#/components/schemas/ProjectRole"
        memberCount:
          type: integer
          example: 4
    Member:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/ProjectRole"
        createdAt:
          type: string
          format: date-time
          example: "2026-09-02T09:30:00.000Z"
        user:
          $ref: "#/components/schemas/User"

    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 2a1b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        projectId:
          type: string
          format: uuid
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        email:
          type: string
          format: email
          example: teammate@example.com
        role:
          $ref: "#/components/schemas/ProjectRole"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        expiresAt:
          type: string
          format: date-time
          example: "2026-09-09T10:00:00.000Z"
        acceptedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
          example: "2026-09-02T10:00:00.000Z"
        invitedBy:
          $ref: "#/components/schemas/User"
    InvitationPreview:
      type: object
      properties:
        project:
          $ref: "#/components/schemas/ProjectRef"
        invitedBy:
          $ref: "#/components/schemas/User"
        email:
          type: string
          format: email
          example: teammate@example.com
        role:
          $ref: "#/components/schemas/ProjectRole"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        expiresAt:
          type: string
          format: date-time
          example: "2026-09-09T10:00:00.000Z"
    AcceptedInvitation:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        role:
          $ref: "#/components/schemas/ProjectRole"
        createdAt:
          type: string
          format: date-time
          example: "2026-09-03T12:00:00.000Z"
        project:
          $ref: "#/components/schemas/ProjectRef"
    ProjectRef:
      type: object
