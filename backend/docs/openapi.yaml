openapi: 3.0.3
info:
  title: Plane API
  version: 1.0.0
  description: |
    REST API for Plane, a collaborative project management platform.

    **Authentication.** `POST /auth/login` sets `accessToken` and `refreshToken` as httpOnly
    cookies and also returns both tokens in the body. Browsers send the cookies automatically.
    In Swagger UI, copy `accessToken` from the login response, click **Authorize** and paste it
    under `bearerAuth`.

    **Email verification.** Every project-related endpoint returns `403` until the user's email
    is verified.

    **Responses.** Successful responses are wrapped as `{ statusCode, data, message, success }`.
    Errors are `{ statusCode, message, errors, success: false }`.
servers:
  - url: /api/v1

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Projects
  - name: Members
  - name: Invitations
  - name: Tasks
  - name: Attachments
  - name: Subtasks
  - name: Comments
  - name: Notes

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /healthcheck:
    get:
      tags: [Health]
      summary: Check API, database and Redis status
      security: []
      responses:
        "200":
          description: Database and Redis are reachable
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Health"
                      message:
                        example: Service is healthy
        "503":
          description: Database or Redis is unreachable
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      statusCode:
                        example: 503
                      data:
                        $ref: "#/components/schemas/Health"
                      message:
                        example: Service is unhealthy
                      success:
                        example: false
              example:
                statusCode: 503
                data: { api: up, database: up, redis: down }
                message: Service is unhealthy
                success: false

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      description: Creates the user and queues a verification email. Rate limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      statusCode:
                        example: 201
                      data:
                        $ref: "#/components/schemas/User"
                      message:
                        example: Registered successfully. Please verify your email.
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: Sets the token cookies and returns both tokens in the body. Rate limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          headers:
            Set-Cookie:
              description: "`accessToken` and `refreshToken`, both httpOnly"
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/LoginResult"
                      message:
                        example: Logged in successfully
        "401":
          description: Wrong email or password (same message for both)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 401
                message: Invalid email or password
                errors: []
                success: false
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Clears the cookies and the stored refresh token.
      responses:
        "200":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/current-user:
    get:
      tags: [Auth]
      summary: Get the logged-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/User"
                      message:
                        example: Current user fetched successfully
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Get a new access token
      description: |
        Reads the refresh token from the `refreshToken` cookie or the request body. Issues a new
        token pair and rotates the refresh token: the old one stops working.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/AuthTokens"
                      message:
                        example: Access token refreshed
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/verify-email/{token}:
    post:
      tags: [Auth]
      summary: Verify an email address
      description: Uses the token from the verification email. Tokens expire after 20 minutes.
      security: []
      parameters:
        - $ref: "#/components/parameters/Token"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          isEmailVerified:
                            type: boolean
                            example: true
                      message:
                        example: Email verified successfully
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/resend-email-verification:
    post:
      tags: [Auth]
      summary: Send a new verification email
      description: For logged-in users whose email is not verified yet. Rate limited.
      responses:
        "200":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      description: Always returns the same response, whether or not the email exists. Rate limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Same response for known and unknown emails
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullDataResponse"
              example:
                statusCode: 200
                data: null
                message: If an account with that email exists, a reset link has been sent
                success: true
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/reset-password/{token}:
    post:
      tags: [Auth]
      summary: Set a new password
      description: |
        Uses the token from the reset email (expires after 20 minutes). Also logs out every
        existing session.
      security: []
      parameters:
        - $ref: "#/components/parameters/Token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change the password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /users/me:
    patch:
      tags: [Users]
      summary: Update the profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/User"
                      message:
                        example: Profile updated successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /users/me/avatar:
    patch:
      tags: [Users]
      summary: Upload or replace the avatar
      description: JPEG, PNG or WEBP, up to 2 MB. The previous avatar is deleted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Updated user with the new avatar URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/User"
                      message:
                        example: Avatar updated successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /projects:
    get:
      tags: [Projects]
      summary: List the user's projects
      responses:
        "200":
          description: Projects the user belongs to, with their role and the member count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Project"
                      message:
                        example: Projects fetched successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Projects]
      summary: Create a project
      description: The creator becomes the project's Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      statusCode:
                        example: 201
                      data:
                        $ref: "#/components/schemas/Project"
                      message:
                        example: Project created successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: Get a project
      description: Any member.
      responses:
        "200":
          description: Project with the user's role and the member count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Project"
                      message:
                        example: Project fetched successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags: [Projects]
      summary: Update a project
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Project"
                      message:
                        example: Project updated successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Projects]
      summary: Delete a project
      description: |
        Admin only. Deletes all members, invitations, tasks, subtasks, attachments, comments,
        notes and activity, and removes attachment files from Cloudinary.
      responses:
        "200":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/dashboard:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: Get the project dashboard
      description: Any member. Cached in Redis for 60 seconds and refreshed when tasks or members change.
      responses:
        "200":
          description: Task and member counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Dashboard"
                      message:
                        example: Dashboard fetched successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/activity:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: Get the project activity feed
      description: Any member. Newest first.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated activity entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/Activity"
                          pagination:
                            $ref: "#/components/schemas/Pagination"
                      message:
                        example: Activity fetched successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Members]
      summary: List project members
      description: Any member.
      responses:
        "200":
          description: Members with their role
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Member"
                      message:
                        example: Members fetched successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [Members]
      summary: Change a member's role
      description: Admin only. The last Admin cannot be demoted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRoleRequest"
      responses:
        "200":
          description: Member with the new role
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Member"
                      message:
                        example: Member role updated successfully
        "400":
          $ref: "#/components/responses/LastAdmin"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Members]
      summary: Remove a member
      description: Admin only. The member's tasks in this project become unassigned. The last Admin cannot be removed.
      responses:
        "200":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/LastAdmin"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/invitations:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Invitations]
      summary: Invite someone by email
      description: |
        Admin only. The email does not need an existing account. An invitation email with a
        7-day link is queued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      statusCode:
                        example: 201
                      data:
                        $ref: "#/components/schemas/Invitation"
                      message:
                        example: Invitation sent successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already a member, or a pending invitation already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 409
                message: A pending invitation already exists for this email
                errors: []
                success: false
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      tags: [Invitations]
      summary: List pending invitations
      description: Admin only. Includes expired pending invitations; check `expiresAt`.
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Invitation"
                      message:
                        example: Invitations fetched successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{projectId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Invitations]
      summary: Revoke an invitation
      description: Admin only. Only pending invitations can be revoked.
      responses:
        "200":
          description: Revoked invitation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Invitation"
                      message:
                        example: Invitation revoked successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /invitations/{token}:
    parameters:
      - $ref: "#/components/parameters/Token"
    get:
      tags: [Invitations]
      summary: Preview an invitation
      description: Public. Lets the frontend show who invited the user to which project.
      security: []
      responses:
        "200":
          description: Invitation details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/InvitationPreview"
                      message:
                        example: Invitation fetched successfully
        "404":
          $ref: "#/components/responses/NotFound"

  /invitations/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/Token"
    post:
      tags: [Invitations]
      summary: Accept an invitation
      description: |
        The logged-in user must have a verified email that matches the invited email.
        Creates the membership and marks the invitation accepted.
      responses:
        "200":
          description: Joined the project
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/AcceptedInvitation"
                      message:
                        example: Invitation accepted
        "400":
          description: The invitation is expired, revoked or already accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 400
                message: This invitation has expired
                errors: []
                success: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Email not verified, or it does not match the invited email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 403
                message: This invitation was sent to a different email address
                errors: []
                success: false
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{projectId}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Tasks]
      summary: List tasks
      description: Any member.
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: priority
          in: query
          schema:
            $ref: "#/components/schemas/TaskPriority"
        - name: assignedTo
          in: query
          description: A user id, or `me` for the logged-in user
          schema:
            type: string
          example: me
        - name: overdue
          in: query
          description: "`true` returns tasks with a past due date that are not DONE"
          schema:
            type: string
            enum: ["true", "false"]
        - name: search
          in: query
          description: Case-insensitive match on the title
          schema:
            type: string
          example: login
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, dueDate, priority]
            default: createdAt
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/Task"
                          pagination:
                            $ref: "#/components/schemas/Pagination"
                      message:
                        example: Tasks fetched successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Tasks]
      summary: Create a task
      description: Admin or Project Admin. The assignee must be a project member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      statusCode:
                        example: 201
                      data:
