        id:
          type: string
          format: uuid
          example: 16fd2706-8baf-433b-82eb-8c7fada847da
        projectId:
          type: string
          format: uuid
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        title:
          type: string
          example: Design the pricing page
        description:
          type: string
          nullable: true
          example: Three tiers, annual toggle
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        dueDate:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-15T00:00:00.000Z"
        assignedToId:
          type: string
          format: uuid
          nullable: true
          example: 9b2c1f4e-3a7d-4e8b-b6c5-1d2e3f4a5b6c
        createdById:
          type: string
          format: uuid
          example: 9b2c1f4e-3a7d-4e8b-b6c5-1d2e3f4a5b6c
        createdAt:
          type: string
          format: date-time
          example: "2026-09-02T11:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-09-02T11:00:00.000Z"
        assignedTo:
          type: object
          allOf:
            - $ref: "#/components/schemas/User"
          nullable: true
        createdBy:
          $ref: "#/components/schemas/User"
    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          properties:
            subtasks:
              type: array
              items:
                $ref: "#/components/schemas/Subtask"
            attachments:
              type: array
              items:
                $ref: "#/components/schemas/Attachment"
            commentCount:
              type: integer
              example: 3
    Subtask:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 4d3c2b1a-6f5e-4d7c-9b8a-1a2b3c4d5e6f
        taskId:
          type: string
          format: uuid
          example: 16fd2706-8baf-433b-82eb-8c7fada847da
        title:
          type: string
          example: Draft copy for each tier
        isCompleted:
          type: boolean
          example: false
        createdById:
          type: string
          format: uuid
          example: 9b2c1f4e-3a7d-4e8b-b6c5-1d2e3f4a5b6c
        createdAt:
          type: string
          format: date-time
          example: "2026-09-02T11:05:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-09-02T11:05:00.000Z"
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 8e7d6c5b-4a3f-4e2d-8c1b-0a9f8e7d6c5b
        taskId:
          type: string
          format: uuid
          example: 16fd2706-8baf-433b-82eb-8c7fada847da
        url:
          type: string
          example: https://res.cloudinary.com/demo/image/upload/plane/attachments/k2j3h4.pdf
        publicId:
          type: string
          example: plane/attachments/k2j3h4
        fileName:
          type: string
          example: pricing-spec.pdf
        mimeType:
          type: string
          example: application/pdf
        size:
          type: integer
          description: Size in bytes
          example: 48213
        uploadedById:
          type: string
          format: uuid
          example: 9b2c1f4e-3a7d-4e8b-b6c5-1d2e3f4a5b6c
        createdAt:
          type: string
          format: date-time
          example: "2026-09-02T11:10:00.000Z"
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 1f2e3d4c-5b6a-4978-8a9b-0c1d2e3f4a5b
        taskId:
          type: string
          format: uuid
          example: 16fd2706-8baf-433b-82eb-8c7fada847da
        authorId:
          type: string
          format: uuid
          example: 9b2c1f4e-3a7d-4e8b-b6c5-1d2e3f4a5b6c
        content:
          type: string
          example: Can we add a FAQ section below the tiers?
        createdAt:
          type: string
          format: date-time
          example: "2026-09-02T12:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-09-02T12:00:00.000Z"
        author:
          $ref: "#/components/schemas/User"
    Note:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 6a5b4c3d-2e1f-4a0b-9c8d-7e6f5a4b3c2d
        projectId:
          type: string
          format: uuid
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        content:
          type: string
          example: Launch checklist lives in the shared drive.
        createdById:
          type: string
          format: uuid
          example: 9b2c1f4e-3a7d-4e8b-b6c5-1d2e3f4a5b6c
        createdAt:
          type: string
          format: date-time
          example: "2026-09-02T13:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-09-02T13:00:00.000Z"
        createdBy:
          $ref: "#/components/schemas/User"
    Activity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3b4c5d6e-7f8a-4b9c-8d0e-1f2a3b4c5d6e
        projectId:
          type: string
          format: uuid
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        actorId:
          type: string
          format: uuid
          example: 9b2c1f4e-3a7d-4e8b-b6c5-1d2e3f4a5b6c
        action:
          type: string
          enum:
            - project.created
            - project.updated
            - member.joined
            - member.role_changed
            - member.removed
            - invitation.sent
            - invitation.revoked
            - task.created
            - task.updated
            - task.status_changed
            - task.deleted
            - note.created
            - note.updated
            - note.deleted
          example: task.status_changed
        entityType:
          type: string
          enum: [project, member, invitation, task, note]
          example: task
        entityId:
          type: string
          format: uuid
          example: 16fd2706-8baf-433b-82eb-8c7fada847da
        metadata:
          type: object
          nullable: true
          example:
            title: Design the pricing page
            from: IN_PROGRESS
            to: DONE
        createdAt:
          type: string
          format: date-time
          example: "2026-09-03T15:00:00.000Z"
        actor:
          $ref: "#/components/schemas/User"
    Dashboard:
      type: object
      properties:
        totalTasks:
          type: integer
          example: 12
        tasksByStatus:
          type: object
          properties:
            TODO:
              type: integer
              example: 5
            IN_PROGRESS:
              type: integer
              example: 4
            DONE:
              type: integer
              example: 3
        tasksByPriority:
          type: object
          properties:
            LOW:
              type: integer
              example: 2
            MEDIUM:
              type: integer
              example: 6
            HIGH:
              type: integer
              example: 4
        overdueTasks:
          type: integer
          example: 2
        openTasksByAssignee:
          type: array
          description: Members with at least one task that is not DONE, most open tasks first
          items:
            type: object
            properties:
              user:
                $ref: "#/components/schemas/User"
              openTasks:
                type: integer
                example: 4
        memberCount:
          type: integer
          example: 4

    RegisterRequest:
      type: object
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
          example: jane@example.com
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[a-z0-9_]+$"
          description: Lowercased before saving
          example: jane_doe
        password:
          type: string
          minLength: 8
          maxLength: 72
          example: password123
        fullName:
          type: string
          maxLength: 100
          example: Jane Doe
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: demo@plane.dev
        password:
          type: string
          example: DemoPass123!
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Only needed when the refreshToken cookie is not sent
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI5YjJjMWY0ZSIsImp0aSI6IjEifQ.signature
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: jane@example.com
    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 72
          example: new-password-123
    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          example: password123
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          example: new-password-123
    UpdateProfileRequest:
      type: object
      description: Send at least one field. `fullName` null clears it.
      properties:
        fullName:
          type: string
          nullable: true
          maxLength: 100
          example: Jane Q. Doe
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[a-z0-9_]+$"
          example: jane_q
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          example: Website Relaunch
        description:
          type: string
          maxLength: 1000
          example: New marketing site for the Q4 launch
    UpdateProjectRequest:
      type: object
      description: Send at least one field. `description` null clears it.
      properties:
        name:
          type: string
          maxLength: 100
          example: Website Relaunch 2.0
        description:
          type: string
          nullable: true
          maxLength: 1000
          example: Scope now includes the blog
    UpdateMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/ProjectRole"
    CreateInvitationRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          example: teammate@example.com
        role:
          $ref: "#/components/schemas/ProjectRole"
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
          example: Design the pricing page
        description:
          type: string
          maxLength: 5000
          example: Three tiers, annual toggle
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        dueDate:
          type: string
          description: A date (2026-10-15) or an ISO timestamp
          example: "2026-10-15"
        assignedToId:
          type: string
          format: uuid
          description: Must be a member of the project
          example: 9b2c1f4e-3a7d-4e8b-b6c5-1d2e3f4a5b6c
    UpdateTaskRequest:
      type: object
      description: Send at least one field. null clears `description`, `dueDate` or `assignedToId`.
      properties:
        title:
          type: string
          maxLength: 200
          example: Design the pricing page v2
        description:
          type: string
          nullable: true
          maxLength: 5000
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        dueDate:
          type: string
          nullable: true
          example: "2026-10-20"
        assignedToId:
          type: string
          format: uuid
          nullable: true
          example: null
    CreateSubtaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
          example: Draft copy for each tier
    UpdateSubtaskRequest:
      type: object
      description: Send at least one field. Members may only send `isCompleted`.
      properties:
        title:
          type: string
          maxLength: 200
          example: Draft and review copy
        isCompleted:
          type: boolean
          example: true
    ContentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 5000
          example: Can we add a FAQ section below the tiers?
